name: Build Fat Loss Training APK

on:
  push:
    branches: [master, main, "claude/**"]
    paths:
      - "fat-loss-app/**"
      - "fat-loss-android/**"
      - ".github/workflows/build-fat-loss-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React app
        working-directory: fat-loss-app
        run: |
          npm ci
          npm run build

      - name: Copy dist into Android assets
        run: |
          rm -rf fat-loss-android/app/src/main/assets/www
          mkdir -p fat-loss-android/app/src/main/assets/www
          cp -r fat-loss-app/dist/. fat-loss-android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: fat-loss-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fat-loss-training-debug
          path: fat-loss-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
