name: Build Debug APK

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > $GITHUB_WORKSPACE/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: debugkey
          KEY_PASSWORD: android

      - name: Publish APK as release
        uses: ncipollo/release-action@v1
        with:
          tag: debug-latest
          name: "Latest Debug Build"
          body: "Auto-built from branch `${{ github.ref_name }}` — commit `${{ github.sha }}`"
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          artifactContentType: application/vnd.android.package-archive
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
